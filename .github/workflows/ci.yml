name: Student MLOps CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test imports
        run: |
          python -c "from project.src.validate_data import validate_data"
          python -c "from project.src.train import train_model"
          python -c "from project.src.evaluate import evaluate_model"
          python -c "from project.src.quality_gate import quality_gate"
          
      - name: Build Docker image
        run: |
          docker build -t student-mlops-api